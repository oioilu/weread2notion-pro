name: debug diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE: ${{ secrets.NOTION_PAGE }}
      WEREAD_COOKIE: ${{ secrets.WEREAD_COOKIE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt
      - name: diag
        run: |
          python -V
          echo "--- which book"; which book; head -3 "$(which book)"
          echo "--- pkg"; pip show weread2notionpro | head -3
          echo "--- env lens"; python -c "import os;print({k:len(os.getenv(k) or '') for k in ['NOTION_TOKEN','NOTION_PAGE','WEREAD_COOKIE']})"
          echo "--- import"; python -u -c "import weread2notionpro.book as b; print('module ok', b.__file__)"
          echo "--- run book"; book; echo "book_rc=$?"
          echo "--- run weread"; weread; echo "weread_rc=$?"
