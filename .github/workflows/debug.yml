name: debug diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      WEREAD_COOKIE: ${{ secrets.WEREAD_COOKIE }}
    steps:
      - name: weread cookie check
        run: |
          python - <<'PY'
          import os, requests
          ck = os.getenv("WEREAD_COOKIE") or ""
          print("cookie_len:", len(ck))
          for url in ["https://i.weread.qq.com/user/notebooks", "https://i.weread.qq.com/shelf/sync?synckey=0&teenmode=0&album=1&onlyBookid=0"]:
              try:
                  r = requests.get(url, headers={"Cookie": ck}, timeout=20)
                  print(url, "->", r.status_code, "| len", len(r.text), "| head", r.text[:120].replace("\n"," "))
              except Exception as e:
                  print(url, "-> EXC", type(e).__name__)
          PY
